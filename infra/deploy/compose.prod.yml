# Forest — production override for the UZ VPS (CLAUDE.md §6 "Prod compose override", §15).
# Always used through infra/deploy/deploy.sh, which sets FOREST_TAG and the env files:
#   docker compose -p forest --env-file .env --env-file .env.ops \
#     -f infra/compose.yml -f infra/deploy/compose.prod.yml --profile apps up -d
#
# - Only Caddy publishes ports; every other service is reachable only on the compose networks.
# - `internal` has no route out (Redis lives only there); `egress` is for services that call out
#   (ACME, payment/SMS/delivery/MoySklad providers, the backup bucket).
# - Images are tagged with the git sha so deploy.sh can roll back to the previous tag.
# - Sizes assume a 4 vCPU / 8 GB VPS; scale the limits with the machine.

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: '20m', max-file: '5' }

x-prod: &prod
  <<: *logging
  restart: always

networks:
  internal:
    internal: true
  egress: {}

services:
  postgres:
    <<: *prod
    image: ${FOREST_IMAGE_PREFIX:-forest}-postgres:${FOREST_PG_TAG:-16}
    build: { context: .., dockerfile: infra/docker/postgres.Dockerfile }
    ports: !reset []
    networks: [internal, egress]
    # Explicit list: postgres sees the pgBackRest repository settings, nothing else from .env.ops.
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGBACKREST_REPO1_S3_ENDPOINT: ${PGBACKREST_REPO1_S3_ENDPOINT:-}
      PGBACKREST_REPO1_S3_BUCKET: ${PGBACKREST_REPO1_S3_BUCKET:-}
      PGBACKREST_REPO1_S3_REGION: ${PGBACKREST_REPO1_S3_REGION:-us-east-1}
      PGBACKREST_REPO1_S3_KEY: ${PGBACKREST_REPO1_S3_KEY:-}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${PGBACKREST_REPO1_S3_KEY_SECRET:-}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_REPO1_CIPHER_PASS:-}
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-5GB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - wal_compression=zstd
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      # Slow-query log without bind values (Prisma sends parameters → they would carry PII).
      - -c
      - log_min_duration_statement=500ms
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_lock_waits=on
      - -c
      - log_temp_files=10MB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
    shm_size: 512m
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 3g }

  redis:
    <<: *prod
    ports: !reset []
    networks: [internal]
    # BullMQ needs noeviction; AOF fsync every second (queues survive a restart).
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory',
        '400mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512m }

  # Self-hosted S3 on the VPS (when no UZ S3 provider is used; then S3_ENDPOINT in .env points
  # there and this service just idles). Credentials file generated by deploy.sh (never in git).
  storage:
    <<: *prod
    ports: !reset []
    networks: [internal, egress]
    # Bind all interfaces: on two networks SeaweedFS would otherwise listen on one address only.
    command:
      [
        'server',
        '-dir=/data',
        '-ip=storage',
        '-ip.bind=0.0.0.0',
        '-s3',
        '-s3.port=8333',
        '-s3.config=/etc/seaweedfs/s3.json',
        '-volume.max=0',
      ]
    volumes: !override
      - storagedata:/data
      - ${SEAWEEDFS_S3_CONFIG:-./deploy/.secrets/seaweedfs-s3.json}:/etc/seaweedfs/s3.json:ro
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 768m }

  mailpit:
    # Dev-only mail catcher: never started in production (no profile selects it).
    profiles: [dev-mail]

  migrate:
    <<: *logging
    image: ${FOREST_IMAGE_PREFIX:-forest}-migrate:${FOREST_TAG:?deploy.sh sets FOREST_TAG}
    networks: [internal]
    restart: 'no'

  api:
    <<: *prod
    image: ${FOREST_IMAGE_PREFIX:-forest}-api:${FOREST_TAG:?deploy.sh sets FOREST_TAG}
    ports: !reset []
    networks: [internal, egress]
    environment:
      # Non-owner role: DML only, AuditLog append-only (infra/deploy/db-roles.sql).
      DATABASE_URL: postgresql://forest_app:${FOREST_APP_DB_PASSWORD:?set FOREST_APP_DB_PASSWORD in .env}@postgres:5432/forest?connection_limit=${API_DB_POOL:-20}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:8333}
      FOREST_RELEASE: ${FOREST_TAG}
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 1536m }

  web:
    <<: *prod
    image: ${FOREST_IMAGE_PREFIX:-forest}-web:${FOREST_TAG:?deploy.sh sets FOREST_TAG}
    ports: !reset []
    networks: [internal, egress]
    environment:
      FOREST_RELEASE: ${FOREST_TAG}
    # Node serves on one core: scale out (Caddy balances over all replicas, infra/Caddyfile).
    # Rule of thumb from the k6 smoke: ~20-25 storefront pages/s per replica (dynamic product pages).
    scale: ${WEB_REPLICAS:-2}
    healthcheck:
      # /t.js is a static route handler: cheap, no API call, proves the server answers.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/t.js || exit 1']
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 768m }

  admin:
    <<: *prod
    image: ${FOREST_IMAGE_PREFIX:-forest}-admin:${FOREST_TAG:?deploy.sh sets FOREST_TAG}
    # The admin CSP (next.config.ts) is baked with the public bucket origin at build time.
    build:
      args:
        S3_PUBLIC_URL: ${S3_PUBLIC_URL:?set S3_PUBLIC_URL}
    ports: !reset []
    networks: [internal, egress]
    environment:
      FOREST_RELEASE: ${FOREST_TAG}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3001/login || exit 1']
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512m }

  caddy:
    <<: *prod
    # Image from infra/compose.yml (caddy:2-alpine); pin a digest on the server if desired.
    networks: [internal, egress]
    ports: !override
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      CDN_DOMAIN: ${CDN_DOMAIN:-cdn.localhost}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
      # Derived by compose.sh from S3_PUBLIC_URL (storefront CSP image/media source).
      CSP_S3_ORIGIN: ${CSP_S3_ORIGIN:-}
      CSP_REPORT: ${CSP_REPORT:-}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-forest-public}
      ADMIN_ALLOWLIST: ${ADMIN_ALLOWLIST:-0.0.0.0/0 ::/0}
    depends_on: !override
      web: { condition: service_healthy }
      admin: { condition: service_healthy }
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 256m }
