# Forest — Coolify deployment (adapted from infra/compose.yml).
# Caddy and mailpit removed: Coolify's own Traefik proxy handles TLS/routing
# to web/admin/api via per-service Domains set in the Coolify UI.
name: forest

x-app-env: &app-env
  env_file: ../.env
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forest}
      POSTGRES_DB: forest
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U forest -d forest']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  storage:
    image: chrislusf/seaweedfs:4.50
    command:
      [
        'server',
        '-dir=/data',
        '-s3',
        '-s3.port=8333',
        '-s3.config=/etc/seaweedfs/s3.json',
        '-volume.max=0',
      ]
    volumes:
      - storagedata:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1']
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    env_file: ../.env
    build: { context: .., dockerfile: infra/docker/api.Dockerfile, target: migrate }
    environment:
      DATABASE_URL: postgresql://forest:${POSTGRES_PASSWORD:-forest}@postgres:5432/forest
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app-env
    build: { context: .., dockerfile: infra/docker/api.Dockerfile, target: runtime }
    environment:
      DATABASE_URL: postgresql://forest:${POSTGRES_PASSWORD:-forest}@postgres:5432/forest
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://storage:8333
      WEB_INTERNAL_URL: http://web:3000
      PORT: 4000
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }

  web:
    <<: *app-env
    build:
      context: ..
      dockerfile: infra/docker/next.Dockerfile
      args:
        APP: web
        S3_PUBLIC_URL: '${S3_PUBLIC_URL:-http://localhost:9000/forest-public}'
        API_INTERNAL_URL: http://api:4000
    environment:
      PORT: 3000
      API_INTERNAL_URL: http://api:4000
    depends_on: [api]

  admin:
    <<: *app-env
    build:
      context: ..
      dockerfile: infra/docker/next.Dockerfile
      args:
        APP: admin
        S3_PUBLIC_URL: '${S3_PUBLIC_URL:-http://localhost:9000/forest-public}'
        API_INTERNAL_URL: http://api:4000
    environment:
      PORT: 3001
      API_INTERNAL_URL: http://api:4000
      WEB_INTERNAL_URL: http://web:3000
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  storagedata:
