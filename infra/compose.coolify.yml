# Forest — Coolify deployment (adapted from infra/compose.yml).
# Caddy and mailpit removed: Coolify's own Traefik proxy handles TLS/routing
# to web/admin/api via per-service Domains set in the Coolify UI.
name: forest

x-app-env: &app-env
  env_file: .env
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forest}
      POSTGRES_DB: forest
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U forest -d forest']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  storage:
    image: chrislusf/seaweedfs:4.50
    # S3 credentials come from the same .env the api reads (S3_ACCESS_KEY / S3_SECRET_KEY), so the
    # two always match and no key is committed (CLAUDE.md "never commit secrets"; the dev file
    # infra/seaweedfs/s3.json is for local compose only). Missing values stop the container loudly.
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        : "$${S3_ACCESS_KEY:?S3_ACCESS_KEY missing in .env}" "$${S3_SECRET_KEY:?S3_SECRET_KEY missing in .env}"
        printf '%s' '{"identities":[{"name":"forest","credentials":[{"accessKey":"'"$$S3_ACCESS_KEY"'","secretKey":"'"$$S3_SECRET_KEY"'"}],"actions":["Admin","Read","List","Tagging","Write"]},{"name":"anonymous","actions":["Read:forest-public"]}]}' > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=0
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes:
      - storagedata:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1']
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    env_file: .env
    restart: 'no'
    build: { context: ., dockerfile: infra/docker/api.Dockerfile, target: migrate }
    environment:
      DATABASE_URL: postgresql://forest:${POSTGRES_PASSWORD:-forest}@postgres:5432/forest
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app-env
    build: { context: ., dockerfile: infra/docker/api.Dockerfile, target: runtime }
    environment:
      DATABASE_URL: postgresql://forest:${POSTGRES_PASSWORD:-forest}@postgres:5432/forest
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://storage:8333
      WEB_INTERNAL_URL: http://web:3000
      PORT: 4000
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }

  web:
    <<: *app-env
    build:
      context: .
      dockerfile: infra/docker/next.Dockerfile
      args:
        APP: web
        S3_PUBLIC_URL: '${S3_PUBLIC_URL:-http://localhost:9000/forest-public}'
        API_INTERNAL_URL: http://api:4000
    environment:
      PORT: 3000
      API_INTERNAL_URL: http://api:4000
    depends_on: [api]

  admin:
    <<: *app-env
    build:
      context: .
      dockerfile: infra/docker/next.Dockerfile
      args:
        APP: admin
        S3_PUBLIC_URL: '${S3_PUBLIC_URL:-http://localhost:9000/forest-public}'
        API_INTERNAL_URL: http://api:4000
    environment:
      PORT: 3001
      API_INTERNAL_URL: http://api:4000
      WEB_INTERNAL_URL: http://web:3000
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  storagedata:
