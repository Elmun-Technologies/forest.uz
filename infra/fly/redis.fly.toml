# Forest DEMO Redis 7 on Fly.io (sessions, rate limits, caches, BullMQ queues).
# Private only: reachable at <app>.internal:6379 (IPv6 → REDIS_URL carries ?family=6 for ioredis).
# BullMQ requires maxmemory-policy noeviction (an evicted job key corrupts a queue); AOF on the
# volume keeps queues and sessions across restarts. REDIS_PASSWORD is a Fly secret (provision.sh).
app = "forest-demo-redis"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  image = "redis:7-alpine"

[processes]
  # The password goes into a 0600 config file owned by `redis` (printf is a shell builtin), never
  # onto a command line where `ps` would show it; then the image's entrypoint drops to `redis`
  # (a first argument ending in .conf is run as `redis-server <conf> …`).
  app = "sh -c 'umask 077 && printf \"requirepass %s\\n\" \"$REDIS_PASSWORD\" > /run/redis-auth.conf && chown redis /run/redis-auth.conf && exec docker-entrypoint.sh /run/redis-auth.conf --dir /data --appendonly yes --maxmemory 150mb --maxmemory-policy noeviction'"

[mounts]
  source = "redisdata"
  destination = "/data"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
