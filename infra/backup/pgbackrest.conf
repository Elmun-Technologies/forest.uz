# pgBackRest — physical backups + continuous WAL archive (PITR) to the UZ backup bucket.
# Non-secret settings only. Credentials and the repository cipher passphrase come from the
# environment of the postgres container (PGBACKREST_REPO1_S3_ENDPOINT, _S3_BUCKET, _S3_REGION,
# _S3_KEY, _S3_KEY_SECRET, PGBACKREST_REPO1_CIPHER_PASS — set in /opt/forest/app/.env.ops,
# docs/runbooks/restore-db.md). Baked into infra/docker/postgres.Dockerfile.
[global]
repo1-type=s3
repo1-path=/pgbackrest
repo1-s3-uri-style=path
# Weekly full (Sunday) + daily differential, 4 fulls kept → ~4-5 weeks of PITR window. Erased
# customers (docs/14 DSR ≤ 30 days) disappear from backups when their last full expires.
repo1-retention-full-type=count
repo1-retention-full=4
repo1-cipher-type=aes-256-cbc
repo1-bundle=y
repo1-block=y
compress-type=zst
compress-level=3
process-max=2
start-fast=y
delta=y
# Async archiving: archive_command returns at once; a bucket outage queues WAL locally up to
# 4 GiB, after which WAL is dropped (PITR gap, alerted by `check`) instead of filling the disk.
archive-async=y
archive-push-queue-max=4GiB
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-stderr=warn
log-level-file=off

[forest]
pg1-path=/var/lib/postgresql/data
pg1-user=forest
pg1-socket-path=/var/run/postgresql
