<!doctype html>
<html lang="uz">
<head>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Admin menyusi" style="font-family: 'Montserrat', ui-sans-serif, system-ui, sans-serif; background: #141712; color: #C9CFC2; border-radius: 28px; padding: 22px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; min-height: 1060px;">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px;">
    <img src="../assets/brand/forest-logo-white.png" alt="Forest" style="width: 104px; height: auto; display: block;">
    <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; background: #334229; color: #D5DDC8; border-radius: 999px; padding: 4px 9px;">ADMIN</span>
  </div>
  <label for="navSearch" style="display: flex; align-items: center; gap: 8px; background: #23271F; border-radius: 14px; padding: 0 12px; height: 42px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8D9586" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="navSearch" placeholder="Buyurtma, mijoz, telefon" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #FFFFFF; font: inherit; font-size: 13px;">
  </label>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="padding: 0 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #6E7768;">{{g.label}}</span>
      <sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
        <a href="{{n.href}}" style="{{n.style}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"/></svg>
          <span style="flex: 1;">{{n.label}}</span>
          <sc-if value="{{n.badge}}" hint-placeholder-val="{{false}}"><span style="{{n.badgeStyle}}">{{n.badge}}</span></sc-if>
        </a>
      </sc-for>
    </div>
  </sc-for>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; border: 1px solid #2E332A; color: #FFFFFF; text-decoration: none; border-radius: 14px; padding: 11px 12px; font-size: 13px; font-weight: 500;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>Saytni ochish</a>
    <div style="display: flex; align-items: center; gap: 10px; padding: 6px 8px;">
      <span style="width: 36px; height: 36px; border-radius: 50%; background: #D5DDC8; color: #141712; display: grid; place-items: center; font-size: 14px; font-weight: 700;">E</span>
      <span style="display: flex; flex-direction: column; font-size: 13px; line-height: 1.3;"><b style="color: #FFFFFF; font-weight: 600;">Elmurodov</b><span style="font-size: 12px;">Egasi · barcha huquqlar</span></span>
    </div>
  </div>
</nav>
</x-dc>

</script>
</body>
</html>
