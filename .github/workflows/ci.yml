name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Typecheck · lint · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm exec turbo run typecheck lint test
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm audit --prod --audit-level high

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@forest/contracts --filter=@forest/db
      - run: pnpm --filter @forest/api test:integration

  e2e:
    name: E2E smoke (Playwright, desktop + 390px)
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Prepare .env (CI-only throwaway secrets)
        run: |
          cp .env.example .env
          sed -i "s|^APP_ENCRYPTION_KEY=.*|APP_ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=$(openssl rand -hex 32)|" .env
      - run: pnpm infra:up
      - run: pnpm exec turbo run build --filter=@forest/contracts --filter=@forest/db
      - run: pnpm db:deploy && pnpm db:seed
      - run: pnpm exec turbo run build --filter=@forest/api --filter=@forest/web --filter=@forest/admin
      - name: Start apps (production mode)
        run: |
          (cd apps/api && pnpm exec dotenv -e ../../.env -- node dist/main.js > /tmp/api.log 2>&1 &)
          (cd apps/web && pnpm exec dotenv -e ../../.env -- pnpm start > /tmp/web.log 2>&1 &)
          (cd apps/admin && pnpm exec dotenv -e ../../.env -- pnpm start > /tmp/admin.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf localhost:4000/ready && curl -sf -o /dev/null localhost:3000/uz && curl -sf -o /dev/null localhost:3001 && exit 0
            sleep 2
          done
          cat /tmp/api.log /tmp/web.log /tmp/admin.log; exit 1
      - run: pnpm --filter @forest/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
        env: { CI: 'true' }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f infra/docker/api.Dockerfile -t forest-api .
      - run: docker build -f infra/docker/next.Dockerfile --build-arg APP=web -t forest-web .
      - run: docker build -f infra/docker/next.Dockerfile --build-arg APP=admin -t forest-admin .
